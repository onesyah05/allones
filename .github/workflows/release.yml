name: release

# Tag a commit `vX.Y.Z` and push it to cut a release: this builds the dashboard,
# cross-compiles the binaries, and publishes them as GitHub Release assets named
# allones_<goos>_<goarch>[.exe] — exactly what the in-app self-updater looks for.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: Build dashboard
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Embed dashboard
        run: |
          rm -rf internal/server/dist
          cp -r web/dist internal/server/dist

      - name: Build binaries
        env:
          CGO_ENABLED: "0"
          GOTOOLCHAIN: local
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          LDFLAGS="-s -w -X github.com/allones/allones/internal/version.Version=${VERSION}"
          mkdir -p dist
          build() {
            goos=$1; goarch=$2; ext=$3
            echo "building ${goos}/${goarch}"
            GOOS=$goos GOARCH=$goarch go build -trimpath -ldflags "$LDFLAGS" \
              -o "dist/allones_${goos}_${goarch}${ext}" ./cmd/allones
          }
          build linux  amd64 ""
          build linux  arm64 ""
          build darwin amd64 ""
          build darwin arm64 ""
          build windows amd64 ".exe"

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt

      - name: Release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 {flag=1; next}
            flag && index($0, "## [") == 1 {exit}
            flag {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release v${VERSION}." > RELEASE_NOTES.md
          fi
          echo "----- release notes -----"; cat RELEASE_NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*
